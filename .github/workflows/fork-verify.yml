name: Fork Verify (Claude branches)

# The stock CI workflows are guarded to the upstream meshtastic/Meshtastic-Android
# repository, so forks get no compile/test feedback. This workflow runs the
# repository's baseline verification on claude/** branches of the fork.

on:
  push:
    branches: [ "claude/**" ]
  workflow_dispatch:

# contents: write is needed by the "Publish APKs" step to maintain the
# easy-mode-latest rolling release; everything else only reads.
permissions:
  contents: write

concurrency:
  group: fork-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.repository != 'meshtastic/Meshtastic-Android'
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          filter: 'blob:none'
          submodules: true

      - name: Gradle Setup
        uses: ./.github/actions/gradle-setup
        with:
          cache_read_only: 'true'
          install_jetbrains_jdk: 'true'

      - name: Lint & Static Analysis
        run: ./gradlew spotlessCheck detekt kmpSmokeCompile -Pci=true --continue

      - name: Assemble Debug
        run: ./gradlew assembleDebug -Pci=true --continue

      # Installable debug APKs. The fdroid flavor is the one to sideload: it needs no
      # API keys and its maps are OSM-based. Debug application IDs are suffixed
      # (com.geeksville.mesh.<flavor>.debug) so they install alongside the Play Store app.
      - name: Upload debug APKs
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: debug-apks
          path: androidApp/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: Unit Tests
        run: ./gradlew test allTests -Pci=true --continue

      # Phone-friendly downloads: artifacts are always zipped, so publish the two
      # useful fdroid debug APKs as plain .apk assets on a rolling pre-release.
      # Stable links (survive re-publishing):
      #   https://github.com/<repo>/releases/download/easy-mode-latest/meshtastic-easy-universal.apk
      #   https://github.com/<repo>/releases/download/easy-mode-latest/meshtastic-easy-arm64.apk
      # Runs after tests so only fully green builds are released.
      - name: Publish APKs to rolling release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          apk_dir=androidApp/build/outputs/apk/fdroid/debug
          mkdir -p release-apks
          cp "$apk_dir"/*-universal-*.apk release-apks/meshtastic-easy-universal.apk
          cp "$apk_dir"/*-arm64-v8a-*.apk release-apks/meshtastic-easy-arm64.apk
          notes="Debug build of ${GITHUB_SHA::7} on $(date -u '+%Y-%m-%d %H:%M') UTC.
          Install meshtastic-easy-universal.apk (works on every phone); meshtastic-easy-arm64.apk is a smaller alternative for most modern phones."
          gh release delete easy-mode-latest --cleanup-tag --yes || true
          gh release create easy-mode-latest \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Easy mode — latest build" \
            --notes "$notes"
          gh release upload easy-mode-latest release-apks/*.apk --clobber
